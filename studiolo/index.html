<style>
/* Layout: a single study desk. Masthead with an intarsia strip, then the month's programme in two columns (reading on the left, the pair's progress on the right); stacks to one column on phones. */
:root {
  --paper: #edf0ec;
  --surface: #f8f9f6;
  --ink: #17232a;
  --muted: #56666c;
  --line: #c9d1ce;
  --lapis: #24429a;
  --lapis-soft: #dfe5f4;
  --gold: #9c7020;
  --gold-soft: #f1e6cf;
  --good: #2c7449;
  --bad: #a8382c;
  --on-accent: #ffffff;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Literata", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1518; --surface: #162026; --ink: #e3e8e3; --muted: #93a2a5; --line: #2a373c;
    --lapis: #93adf3; --lapis-soft: #1c2a4a; --gold: #d8ae5c; --gold-soft: #33291a;
    --good: #6dbf8d; --bad: #ee8b7e; --on-accent: #0f1518; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1518; --surface: #162026; --ink: #e3e8e3; --muted: #93a2a5; --line: #2a373c;
  --lapis: #93adf3; --lapis-soft: #1c2a4a; --gold: #d8ae5c; --gold-soft: #33291a;
  --good: #6dbf8d; --bad: #ee8b7e; --on-accent: #0f1518; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.6; padding: 0 16px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 64px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--lapis); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }

.label { font-family: var(--mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Masthead */
.mast { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.wordmark { font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(30px, 5vw, 44px); line-height: 1; letter-spacing: -.01em; }
.wordmark b { font-style: normal; font-weight: 700; }
.motto { font-family: var(--display); font-style: italic; color: var(--muted); font-size: 15px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; font-size: 15px; color: var(--muted); }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--gold); }
.intarsia {
  height: 10px; margin: 14px 0 6px; border-radius: 2px;
  background:
    repeating-linear-gradient(45deg, var(--gold) 0 6px, transparent 6px 12px),
    repeating-linear-gradient(-45deg, var(--lapis) 0 6px, transparent 6px 12px);
  opacity: .55;
}
.statusline { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; min-height: 28px; }
.people { display: flex; gap: 6px; align-items: center; }
.notice { margin-top: 14px; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--gold); background: var(--surface); border-radius: var(--r); font-size: 14.5px; }

/* Avatars */
.av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-family: var(--mono); font-size: 11px; color: var(--on-accent); background: var(--muted); flex: none; overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.sm { width: 20px; height: 20px; font-size: 9px; }
.av.off { opacity: .22; filter: grayscale(1); }

/* Buttons and chips */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 15px; line-height: 1.3; text-align: left; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--lapis); border-color: var(--lapis); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.gold { background: var(--gold-soft); border-color: var(--gold); }
.btn.quiet { background: none; border-color: transparent; color: var(--lapis); padding-inline: 4px; }
.btn.quiet:hover { text-decoration: underline; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 13.5px; }
.chip { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { border-color: var(--good); color: var(--good); }
.chip.gold { border-color: var(--gold); color: var(--gold); }
.chip.theme { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; width: 100%; }
.chip.lapis { border-color: var(--lapis); color: var(--lapis); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Topic page */
main { margin-top: 28px; }
.hero { display: grid; gap: 10px; max-width: 760px; margin-bottom: 32px; }
.hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(34px, 6vw, 60px); line-height: 1.04; letter-spacing: -.015em; }
.hero .sub { font-family: var(--display); font-style: italic; font-size: clamp(18px, 2.4vw, 22px); color: var(--muted); }
.hero .intro { max-width: 65ch; }
.grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 32px; } }
.sec { display: grid; gap: 14px; }
.sec + .sec { margin-top: 40px; }
.sec h2 { font-family: var(--display); font-weight: 600; font-size: 26px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }

.chapters { list-style: none; margin: 0; padding: 0; }
.chap { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 14px; padding: 14px 6px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; }
.chap:hover { background: var(--surface); }
.chap .rn { font-family: var(--display); font-size: 24px; color: var(--gold); line-height: 1.15; text-align: right; }
.chap h3 { font-size: 18px; font-weight: 600; line-height: 1.3; }
.chap .sum { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
.chap .meta { display: grid; justify-items: end; gap: 6px; }
.ticks { display: flex; gap: 3px; }
@media (max-width: 520px) { .chap { grid-template-columns: 34px minmax(0, 1fr); } .chap .meta { grid-column: 2; justify-items: start; grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; } .chap .rn { font-size: 20px; } }

.books { display: grid; gap: 0; }
.book { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.book .t { font-family: var(--display); font-style: italic; font-size: 19px; line-height: 1.25; }
.book .a { font-size: 14.5px; }
.book .why { grid-column: 1 / -1; color: var(--muted); font-size: 14.5px; }
.read-toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.read-toggle input { accent-color: var(--lapis); width: 16px; height: 16px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 16px; }
.panel h2 { font-family: var(--display); font-weight: 600; font-size: 22px; }
.person { display: grid; gap: 6px; }
.person .who { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lapis); border-radius: 99px; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; color: var(--muted); }
.kv b { color: var(--ink); font-weight: 500; }
.extras { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.extras li { display: grid; gap: 2px; font-size: 14.5px; }
.extras .t { font-weight: 600; }

/* Chapter page */
.back { margin-bottom: 18px; }
.chap-hero { display: grid; gap: 8px; max-width: 760px; margin-bottom: 28px; }
.chap-hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 5vw, 48px); line-height: 1.08; }
.points { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.points li::marker { color: var(--gold); }
.prose { max-width: 68ch; display: grid; gap: 14px; }
.prose h2, .prose h3 { font-family: var(--display); font-weight: 600; font-size: 22px; margin-top: 12px; }
.prose h4 { font-size: 17px; margin-top: 6px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.prose strong { font-weight: 650; }
.reading { border-left: 3px solid var(--gold); padding: 4px 0 4px 14px; font-style: italic; }
.thinking { color: var(--muted); font-style: italic; }
.thinking::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
@media (prefers-reduced-motion: reduce) { .thinking::after { animation: none; content: "..."; } }
textarea, input[type="text"] { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 16px; }
.scores { display: grid; gap: 8px; }
.score-line { display: flex; gap: 10px; align-items: center; font-size: 14.5px; }

/* Quiz */
.quiz { display: grid; gap: 22px; max-width: 760px; }
.q { display: grid; gap: 10px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.q .qt { font-weight: 600; font-size: 17px; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; }
.q .qt span { font-family: var(--display); color: var(--gold); font-size: 20px; line-height: 1.3; }
.opts { display: grid; gap: 6px; padding-left: 66px; }
@media (max-width: 520px) { .opts { padding-left: 0; } .q .qt { grid-template-columns: 46px minmax(0, 1fr); } }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 9px 12px; cursor: pointer; text-align: left; width: 100%; }
.opt:hover { border-color: var(--muted); }
.opt .k { font-family: var(--mono); font-size: 13px; color: var(--muted); padding-top: 2px; }
.opt[aria-pressed="true"] { border-color: var(--lapis); background: var(--lapis-soft); }
.opt.right { border-color: var(--good); }
.opt.right .k { color: var(--good); }
.opt.wrong { border-color: var(--bad); }
.opt.wrong .k { color: var(--bad); }
.explain { padding-left: 66px; color: var(--muted); font-size: 14.5px; }
@media (max-width: 520px) { .explain { padding-left: 0; } }
.result { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 18px; border: 1px solid var(--gold); background: var(--gold-soft); border-radius: var(--r); }
.result .big { font-family: var(--display); font-size: 44px; font-weight: 700; line-height: 1; }

/* Plan & archive */
.plan { list-style: none; margin: 0; padding: 0; }
.plan li { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.plan .m { font-family: var(--display); font-style: italic; font-size: 18px; }
.plan li.now .m { color: var(--gold); font-weight: 600; }
.plan .ttl { display: grid; gap: 4px; min-width: 0; }
.plan .ttl input { font-weight: 600; }
.plan .ttl .s { font-size: 14px; color: var(--muted); }
.plan .act { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.suggest { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 680px) { .plan li { grid-template-columns: minmax(0, 1fr); } .plan .act { justify-content: flex-start; } .suggest { grid-column: 1; } }
.arch { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.arch .card { text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; align-content: start; }
.arch .card:hover { border-color: var(--gold); }
.arch .card h3 { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.2; }
.empty { display: grid; gap: 14px; justify-items: start; max-width: 640px; padding: 28px; border: 1px dashed var(--line); border-radius: var(--r); }
.empty h2 { font-family: var(--display); font-weight: 600; font-size: 28px; }
.err { color: var(--bad); font-size: 14.5px; }

/* Challenge */
.duel-score { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.duel-score .side { display: flex; align-items: center; gap: 10px; }
.duel-score .pts { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.duel-score .vs { font-family: var(--display); font-style: italic; color: var(--muted); }
.duel-wrap { overflow-x: auto; }
.duel { width: 100%; border-collapse: collapse; font-size: 15px; }
.duel th, .duel td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.duel th { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.duel td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.duel td.lead { color: var(--gold); font-weight: 600; }
.log { list-style: none; margin: 0; padding: 0; display: grid; }
.log li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.rival { flex-basis: 100%; font-size: 14.5px; color: var(--muted); }
.rival b { color: var(--ink); font-weight: 600; }
.media { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0 24px; }
.media li { display: grid; gap: 2px; align-content: start; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; min-width: 0; }
.media .t { font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.media .by { font-style: italic; }
.media .note { color: var(--muted); }
.media a { font-size: 13.5px; margin-top: 2px; }
.cmap { margin: 6px 0 0; display: grid; justify-items: center; }
.cmap-center { position: relative; background: var(--lapis); color: var(--on-accent); font-family: var(--display); font-weight: 600; font-size: 20px; padding: 10px 22px; border-radius: 99px; text-align: center; max-width: 100%; }
.cmap-center::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 18px; background: var(--line); }
.cmap-branches { margin-top: 18px; width: 100%; justify-content: center; border-top: 2px solid var(--line); padding-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 220px)); gap: 14px; }
.cmap-branch { position: relative; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.cmap-branch::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 2px; height: 16px; background: var(--line); }
.cmap-title { font-weight: 650; margin-bottom: 4px; }
.cmap-branch ul { margin: 0; padding-left: 1.1em; font-size: 14.5px; color: var(--muted); display: grid; gap: 2px; }
.prose pre { overflow-x: auto; background: var(--surface); padding: 10px; border-radius: var(--r); font-size: 13px; }
.quiz-actions { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--paper); padding: 12px 0; border-top: 1px solid var(--line); }
.lesson-cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.lesson-card { width: 100%; height: 100%; text-align: left; display: grid; gap: 3px; align-content: start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
.lesson-card:hover { border-color: var(--muted); }
.lesson-card.on { border-color: var(--lapis); background: var(--lapis-soft); }
.lesson-card .t { font-weight: 650; line-height: 1.3; }
.lesson-card .f { font-size: 13.5px; color: var(--muted); }
.lesson-h { font-family: var(--display); font-weight: 600; font-size: 22px; }
.chip.now { border-color: var(--lapis); color: var(--on-accent); background: var(--lapis); }

/* Vote */
.cands { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.cand { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.cand.mine { border-color: var(--lapis); background: var(--lapis-soft); }
.cand.win { border-color: var(--gold); background: var(--gold-soft); }
.cand .rn { font-family: var(--display); font-size: 22px; color: var(--gold); text-align: center; }
.cand .t { font-weight: 600; font-size: 17px; line-height: 1.3; }
.cand .s { color: var(--muted); font-size: 14.5px; }
.cand .tally { grid-column: 2 / -1; display: flex; align-items: center; gap: 10px; }
.cand .tally .bar { flex: 1; }
.cand .tally .bar i { background: var(--gold); }

function md(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");
  let out = "", list = null, para = [];
  const flushP = () => { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const flushL = () => { if (list) { out += "</" + list + ">"; list = null; } };
  let fence = null, fenceBuf = [];
  for (const raw of String(src || "").split(/\r?\n/)) {
    const l = raw.trim(); let m;
    if (fence !== null) {
      if (l.startsWith("```")) { out += fence === "mappa" ? conceptMap(fenceBuf.join("\n")) : "<pre>" + esc(fenceBuf.join("\n")) + "</pre>"; fence = null; fenceBuf = []; }
      else fenceBuf.push(raw);
      continue;
    }
    if ((m = l.match(/^```\s*([a-zA-Z]*)/))) { flushP(); flushL(); fence = m[1].toLowerCase(); continue; }
    if (!l) { flushP(); flushL(); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flushP(); flushL(); const lv = Math.min(4, m[1].length + 1); out += `<h${lv}>${inline(m[2])}</h${lv}>`; continue; }
    if ((m = l.match(/^[-*•]\s+(.*)/))) { flushP(); if (list !== "ul") { flushL(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)/))) { flushP(); if (list !== "ol") { flushL(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  if (fence !== null) out += fence === "mappa" ? `<p class="thinking">Disegno la mappa di riepilogo</p>` : "<pre>" + esc(fenceBuf.join("\n")) + "</pre>";
  return out;
}
function conceptMap(src) {
  let m;
  try { m = JSON.parse(src); } catch (e) { m = null; }
  if (!m || !Array.isArray(m.rami) || !m.rami.length) return "<pre>" + esc(src) + "</pre>";
  return `<figure class="cmap" aria-label="Mappa di riepilogo">
    <div class="cmap-center">${esc(m.centro || "")}</div>
    <div class="cmap-branches">${m.rami.slice(0, 8).map(r => `
      <div class="cmap-branch"><div class="cmap-title">${esc(r.titolo || "")}</div>
      <ul>${(Array.isArray(r.voci) ? r.voci : []).slice(0, 6).map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>`).join("")}
    </div>
  </figure>`;
}

/* ---------- storage: shared db when available, this browser otherwise ---------- */
const LS_KEY = "studiolo-locale-v1";
const Store = {
  mode: "local", db: null, data: {}, subs: [], chains: {},
  init(db) {
    if (db) { this.mode = "cloud"; this.db = db; return; }
    try { this.data = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { this.data = {}; }
  },
  persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) {} },
  rows(coll) { return Object.entries(this.data[coll] || {}).map(([id, d]) => ({ ...d, id })); },
  watch(coll, cb) {
    if (this.mode === "cloud") {
      return this.db.collection(coll).onSnapshot(
        s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))),
        () => notice("Il collegamento ai dati salvati si è interrotto. Ricarica la pagina per riprendere.")
      );
    }
    const sub = { coll, cb }; this.subs.push(sub); cb(this.rows(coll));
    return () => { this.subs = this.subs.filter(x => x !== sub); };
  },
  async get(coll, id) {
    if (this.mode === "cloud") { const s = await this.db.doc(coll + "/" + id).get(); return s.exists ? s.data() : null; }
    return (this.data[coll] || {})[id] ?? null;
  },
  del(coll, id) {
    const key = coll + "/" + id;
    const run = async () => {
      if (this.mode === "cloud") return this.db.doc(key).delete();
      if (this.data[coll]) delete this.data[coll][id];
      this.persist();
      this.subs.filter(s => s.coll === coll).forEach(s => s.cb(this.rows(coll)));
    };
    const p = (this.chains[key] || Promise.resolve()).catch(() => {}).then(run);
    this.chains[key] = p; return p;
  },
  set(coll, id, data) {
    const key = coll + "/" + id;
    const run = async () => {
      if (this.mode === "cloud") return this.db.doc(key).set(data);
      (this.data[coll] ||= {})[id] = JSON.parse(JSON.stringify(data)); this.persist();
      this.subs.filter(s => s.coll === coll).forEach(s => s.cb(this.rows(coll)));
    };
    const p = (this.chains[key] || Promise.resolve()).catch(() => {}).then(run);
    this.chains[key] = p; return p;
  }
};

const TEST_SIZE = 30, PRACTICE_SIZE = 10;
// Ask Claude for questions until there are exactly `target` valid, distinct ones:
// malformed questions are dropped by cleanQuestions, so top up what is missing.
async function genQuestions(prompt, target, ctl) {
  const opts = () => ({ modelTier: "default", signal: ctl.signal, cache: false });
  const key = q => q.q.trim().toLowerCase();
  let qs = cleanQuestions(await S.sample.json(prompt, opts()), 1) || [];
  qs = qs.filter((q, i) => qs.findIndex(x => key(x) === key(q)) === i);
  for (let round = 0; qs.length < target && round < 3; round++) {
    const missing = target - qs.length;
    const more = await S.sample.json(`${prompt}

Hai già scritto queste domande: non ripeterle e non riformularle.
${qs.map((q, i) => `${i + 1}. ${q.q}`).join("\n")}

Ora scrivi SOLO ${missing} ${missing === 1 ? "domanda nuova" : "domande nuove"}, con lo stesso formato JSON: {"questions": [...]} con esattamente ${missing} ${missing === 1 ? "elemento" : "elementi"}.`, opts());
    const add = (cleanQuestions(more, 1) || []).filter(q => !qs.some(x => key(x) === key(q)));
    qs = qs.concat(add);
  }
  if (qs.length < target) throw { code: "invalid_json" };
  return qs.slice(0, target);
}
function cleanQuestions(r, min) {
  const qs = (r && Array.isArray(r.questions) ? r.questions : []).filter(q =>
    q && typeof q.q === "string" && Array.isArray(q.options) && q.options.length === 4 &&
    Number.isInteger(Number(q.answer)) && Number(q.answer) >= 0 && Number(q.answer) < 4
  ).map(q => ({ q: String(q.q), options: q.options.map(String), answer: Number(q.answer), explain: String(q.explain || "") }));
  return qs.length >= min ? qs : null;
}
function normalizeTopic(r, title, month) {
  if (!r || !Array.isArray(r.chapters)) return null;
  const chapters = r.chapters.filter(c => c && c.title).slice(0, 4).map((c, i) => ({
    id: "c" + (i + 1), title: String(c.title), summary: String(c.summary || ""),
    points: Array.isArray(c.points) ? c.points.map(String).slice(0, 8) : [],
    reading: String(c.reading || ""), minutes: Number(c.minutes) || 90, media: normMedia(c.media, 4),
    lessons: lessonPlan({ ...c, points: Array.isArray(c.points) ? c.points.map(String) : [] })
  }));
  if (chapters.length < 3) return null;
  const books = (Array.isArray(r.books) ? r.books : []).filter(b => b && b.title).slice(0, 8).map(b => ({
    title: String(b.title), author: String(b.author || ""), year: Number(b.year) || null,
    level: ["introduttivo", "approfondimento", "classico"].includes(b.level) ? b.level : "approfondimento", why: String(b.why || "")
  }));
  const extras = normMedia(r.extras, 12);
  return { month, title: String(r.title || title), subtitle: String(r.subtitle || ""), intro: String(r.intro || ""),
    chapters, books, extras, createdAt: new Date().toISOString(), createdBy: S.me || null, source: "claude" };
}

async function clearMonth(month) {
  const ids = [];
  ["c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8", "final"].forEach(k => ids.push(["quizzes", month + "--" + k]));
  ["c1", "c2", "c3", "c4"].forEach(c => { ids.push(["lessons", month + "--" + c]); [1, 2, 3].forEach(l => ids.push(["lessons", `${month}--${c}--l${l}`])); });
  S.progress.filter(p => p.topic === month).forEach(p => ids.push(["progress", p.id]));
  for (const [c, id] of ids) { try { await Store.del(c, id); } catch (e) {} }
  Object.keys(S.quizCache).forEach(k => { if (k.startsWith(month + "--")) delete S.quizCache[k]; });
  Object.keys(S.lessons).forEach(k => { if (k.startsWith(month + "--")) delete S.lessons[k]; });
  S.progress = S.progress.filter(p => p.topic !== month);
}

async function finalFromChapters(topic) {
  const pool = [];
  for (const c of topic.chapters) {
    const q = S.quizCache[topic.id + "--" + c.id] || await Store.get("quizzes", topic.id + "--" + c.id);
    if (q?.questions?.length) {
      const shuffled = [...q.questions].sort(() => Math.random() - .5);
      pool.push(...shuffled.slice(0, Math.ceil(TEST_SIZE / topic.chapters.length)));
    }
  }
  return pool.length >= 10 ? { questions: shuffle(pool).slice(0, TEST_SIZE), source: "capitoli" } : null;
}
function studiedChapters(topic) {
  const p = S.me ? prog(topic.id, S.me) : null;
  return topic.chapters.filter(c => p?.done?.[c.id]);
}
async function practiceQuiz(topic, withClaude) {
  const studied = studiedChapters(topic);
  if (!studied.length) return { error: "Segna come " + (isWeekly(topic) ? "completata almeno una settimana" : "studiato almeno un capitolo") + ": l'allenamento fa domande solo sugli argomenti che hai già studiato." };
  const chapters = studied.map(c => c.id);
  if (withClaude) {
    const ctl = new AbortController(); S.quiz.ctl = ctl;
    const questions = await genQuestions(promptPractice(topic, studied), PRACTICE_SIZE, ctl);
    return { questions, chapters, source: "claude" };
  }
  const banks = [];
  for (const c of studied) {
    const id = topic.id + "--" + c.id;
    const q = S.quizCache[id] || await Store.get("quizzes", id);
    if (q?.questions?.length) { S.quizCache[id] = q; banks.push(shuffle(q.questions)); }
  }
  if (!banks.length) return canAsk() ? practiceQuiz(topic, true) : { error: "Non ci sono ancora domande per gli argomenti che hai studiato. Apri il test conclusivo di una settimana per prepararle." };
  const out = [];
  for (let i = 0; out.length < PRACTICE_SIZE && banks.some(b => b.length); i++) { const b = banks[i % banks.length]; if (b.length) out.push(b.pop()); }
  return { questions: shuffle(out), chapters, source: "banca" };
}
async function loadQuiz(topic, key, fresh) {
  if (key === "practice") return practiceQuiz(topic, fresh && canAsk());
  const id = topic.id + "--" + key;
  if (!fresh) {
    if (S.quizCache[id]) return S.quizCache[id];
    const q = await Store.get("quizzes", id);
    if (q?.questions?.length) { S.quizCache[id] = q; return q; }
  }
  if (!canAsk()) {
    if (key === "final") return finalFromChapters(topic);
    return null;
  }
  const ch = key === "final" ? null : topic.chapters.find(c => c.id === key);
  const ctl = new AbortController(); S.quiz.ctl = ctl;
  const questions = await genQuestions(promptQuiz(topic, ch), TEST_SIZE, ctl);
  const doc = { topic: topic.id, key, questions, createdAt: new Date().toISOString(), source: "claude" };
  S.quizCache[id] = doc;
  await save("quizzes", id, doc);

async function openQuiz(topicId, key, fresh) {
  const topic = topicById(topicId); if (!topic) return;
  S.view = { name: "quiz", topicId, key };
  S.quiz = { topicId, key, data: null, answers: {}, submitted: false, loading: true, error: null };
  window.scrollTo(0, 0); render();
  try {
    const data = await loadQuiz(topic, key, fresh);
    if (S.quiz?.topicId !== topicId || S.quiz.key !== key) return;
    S.quiz.loading = false;
    if (data?.error) { S.quiz.error = data.error; render(); return; }
    S.quiz.data = data;
    const done = key !== "practice" && S.me ? prog(topicId, S.me).quiz?.[key] : null;
    if (data && done?.attempts) {
      S.quiz.submitted = true; S.quiz.locked = true;
      const a = Array.isArray(done.answers) ? done.answers : [];
      a.forEach((v, i) => { if (Number.isInteger(v)) S.quiz.answers[i] = v; });
      const h = (done.history || [])[0] || {};
      S.quiz.score = { pct: done.best, right: h.right ?? Math.round(done.best * data.questions.length / 100), total: h.total ?? data.questions.length };
      S.quiz.noReview = !a.length;
    }
    if (!data) S.quiz.error = "Questo test non è ancora stato preparato e Claude non è disponibile in questa vista per scriverlo.";
  } catch (e) {
    if (!S.quiz) return;

function submitQuiz() {
  const z = S.quiz; if (!z?.data) return;
  const qs = z.data.questions;
  if (z.submitted) return;
  if (z.key !== "practice" && prog(z.topicId, S.me).quiz?.[z.key]?.attempts) { toast("Hai già fatto questo test: c'è un solo tentativo."); return; }
  if (Object.keys(z.answers).length < qs.length) { toast("Rispondi a tutte le domande prima di consegnare."); return; }
  const right = qs.filter((q, i) => z.answers[i] === q.answer).length;
  const pct = Math.round(right / qs.length * 100);
  z.submitted = true; z.score = { right, total: qs.length, pct };
  saveProg(z.topicId, cur => {
    const prev = cur.quiz[z.key] || {};
    const entry = { pct, right, total: qs.length, at: new Date().toISOString() };
    if (z.key === "practice") entry.chapters = z.data.chapters || [];
    const hist = [...(prev.history || []), entry].slice(z.key === "practice" ? -200 : -10);
    cur.quiz[z.key] = { best: Math.max(prev.best ?? 0, pct), last: pct, attempts: (prev.attempts || 0) + 1, history: hist };
    if (z.key !== "practice") cur.quiz[z.key].answers = qs.map((q, i) => z.answers[i]);
  });
  window.scrollTo(0, 0);
}

const VOTES_EACH = 3, CANDIDATES = 5;
// One-time exception: a vote for the current month (flag currentMonth on votes/<NOW>)
// stays active until its winner's programme has been prepared.
function currentMonthVote() {
  const v = S.votes.find(x => x.id === NOW && x.currentMonth);
  if (!v) return null;
  if (v.status === "closed" && v.round && topicById(NOW)?.voteRound === v.round) return null;
  return v;
}
const voteMonth = () => currentMonthVote() ? NOW : addMonths(NOW, 1);
const topicForVote = (month, vote) => { const t = topicById(month); return t && (month !== NOW || !vote?.currentMonth || t.voteRound === vote.round) ? t : null; };
const voteFor = month => S.votes.find(v => v.id === month && Array.isArray(v.candidates) && v.candidates.length) || null;
function ballotFor(uid, round) {
  const b = S.ballots.find(x => x.id === uid);
  const picks = b?.rounds?.[round]?.picks;
  return Array.isArray(picks) ? picks : null;
}
function voters(vote) {
  const ids = new Set(peopleFor(null));
  S.ballots.forEach(b => { if (b.rounds?.[vote.round]) ids.add(b.id); });
  return [...ids];
}
function voteState(vote) {
  const people = voters(vote);
  const complete = people.filter(uid => (ballotFor(uid, vote.round) || []).length === VOTES_EACH);
  const counts = Object.fromEntries(vote.candidates.map(c => [c.key, []]));
  complete.forEach(uid => ballotFor(uid, vote.round).forEach(k => { if (counts[k]) counts[k].push(uid); }));
  const max = Math.max(0, ...Object.values(counts).map(a => a.length));
  const leaders = max ? vote.candidates.filter(c => counts[c.key].length === max) : [];
  const revealed = vote.status === "closed" || complete.length >= 2;
  return { people, complete, counts, max, leaders, revealed };
}
function myPicks(vote) {
  return S.picks[vote.round] || [...(ballotFor(S.me, vote.round) || [])];
}
function togglePick(vote, key) {
  if (vote.status !== "open") return;
  const picks = S.picks[vote.round] = myPicks(vote), i = picks.indexOf(key);
  if (i >= 0) picks.splice(i, 1);
  else if (picks.length >= VOTES_EACH) { toast("Hai già usato i tuoi " + VOTES_EACH + " voti: togline uno per spostarlo."); return; }
  else picks.push(key);
  render();
}
async function submitBallot(vote) {
  const picks = [...new Set(myPicks(vote))].filter(k => vote.candidates.some(c => c.key === k));
  if (picks.length !== VOTES_EACH) { toast("Assegna tutti e " + VOTES_EACH + " i voti, uno per argomento."); return; }
  if (!S.me) { toast("Accedi a Claude per votare."); return; }
  const cur = S.ballots.find(b => b.id === S.me);
  const rounds = { ...(cur?.rounds || {}) };
  rounds[vote.round] = { picks, month: vote.id, at: new Date().toISOString() };
  const keep = Object.entries(rounds).sort((a, b) => String(b[1].at).localeCompare(String(a[1].at))).slice(0, 12);
  const doc = { uid: S.me, rounds: Object.fromEntries(keep) };
  const row = { ...doc, id: S.me };
  const i = S.ballots.findIndex(b => b.id === S.me);
  if (i >= 0) S.ballots[i] = row; else S.ballots.push(row);
  delete S.picks[vote.round];
  render();
  await save("ballots", S.me, doc, "Voti registrati");
}
function readDraft() {
  const items = [];
  for (let i = 0; i < CANDIDATES; i++) {
    const t = (document.getElementById("cand-t-" + i)?.value || "").trim();
    const st = (document.getElementById("cand-s-" + i)?.value || "").trim();
    const th = normTheme(document.getElementById("cand-th-" + i)?.value);
    items.push({ title: t, subtitle: st, theme: th });
  }
  return items;
}
async function openVote(month) {
  const items = readDraft();
  if (items.some(x => !x.title)) { toast("Scrivi tutti e " + CANDIDATES + " gli argomenti prima di aprire la votazione."); return; }
  if (items.some(x => !x.theme)) { toast("Scegli il tema di ogni argomento."); return; }
  if (new Set(items.map(x => x.title.toLowerCase())).size < CANDIDATES) { toast("Ci sono due argomenti uguali: cambiane uno."); return; }
  const doc = { month, round: "r" + Date.now().toString(36), status: "open", winner: null,
    candidates: items.map((x, i) => ({ key: "k" + (i + 1), title: x.title, subtitle: x.subtitle, theme: x.theme })),
    createdBy: S.me || null, createdAt: new Date().toISOString() };
  if (S.votes.find(v => v.id === month)?.currentMonth) doc.currentMonth = true;
  S.votes = [...S.votes.filter(v => v.id !== month), { ...doc, id: month }];
  render();
  await save("votes", month, doc, "Votazione aperta");
}
async function suggestCandidates(month) {
  if (!canAsk()) { toast("Claude non è disponibile in questa vista."); return; }
  const current = readDraft();
  S.voteSuggest = { busy: true }; render();
  try {
    const taken = S.topics.map(t => t.title).join("; ");
    const keepTitles = current.filter(x => x.title).map(x => x.title);
    const r = await S.sample.json(promptSuggest(month, taken + (keepTitles.length ? "; " + keepTitles.join("; ") : "")), { modelTier: "quick", cache: false });
    const list = (Array.isArray(r) ? r : []).filter(x => x && x.title && normTheme(x.theme)).map(x => ({ title: String(x.title), subtitle: String(x.subtitle || ""), theme: normTheme(x.theme) }));
    if (!list.length) throw { code: "invalid_json" };
    S.voteSuggest = null; render();
    const used = new Set(current.filter(x => x.title && x.theme).map(x => x.theme));
    const fresh = [...list.filter(x => !used.has(x.theme)), ...list.filter(x => used.has(x.theme))];
    let k = 0;
    for (let i = 0; i < CANDIDATES && k < fresh.length; i++) {
      const t = document.getElementById("cand-t-" + i), st = document.getElementById("cand-s-" + i), th = document.getElementById("cand-th-" + i);
      if (t && !t.value.trim()) { t.value = fresh[k].title; if (st) st.value = fresh[k].subtitle; if (th) th.value = fresh[k].theme; k++; }
    }
    if (!k) toast("Tutte le righe sono già piene: svuotane una per ricevere un'altra proposta.");
  } catch (e) { S.voteSuggest = { error: sampleErr(e) }; render(); }
}
async function closeVote(vote, pickRandom) {
  const st = voteState(vote);
  if (!st.leaders.length) return;
  const winner = pickRandom ? st.leaders[Math.floor(Math.random() * st.leaders.length)] : st.leaders[0];
  const doc = { ...vote, status: "closed", winner: winner.key, tieBreak: st.leaders.length > 1, closedAt: new Date().toISOString() };
  delete doc.id;
  S.votes = S.votes.map(v => v.id === vote.id ? { ...doc, id: vote.id } : v);
  render();
  await save("votes", vote.id, doc, "Ha vinto: " + winner.title);
}

/* ---------- challenge ---------- */
function quizLabel(topic, key) {
  if (key === "final") return "Esame finale";
  if (key === "practice") return "Allenamento";
  const i = topic.chapters.findIndex(c => c.id === key);
  return i >= 0 ? (isWeekly(topic) ? "Test settimana " : "Test capitolo ") + roman(i + 1) : "Test";
}
function challenge(topic) {
  const ppl = peopleFor(topic.id);
  const pts = Object.fromEntries(ppl.map(u => [u, 0]));
  const rows = [...topic.chapters.map(c => c.id), "final"].map(key => {
    const scores = ppl.map(u => { const b = prog(topic.id, u).quiz?.[key]?.best; return typeof b === "number" ? b : null; });
    let lead = [];
    if (ppl.length >= 2 && scores.every(x => x != null)) {
      const mx = Math.max(...scores);
      lead = ppl.filter((u, i) => scores[i] === mx);
      lead.forEach(u => pts[u]++);
    }
    return { key, label: quizLabel(topic, key), scores, lead };
  });
  const practice = ppl.map(u => (prog(topic.id, u).quiz?.practice?.history || []).length);
  const log = [];
  ppl.forEach(u => Object.entries(prog(topic.id, u).quiz || {}).forEach(([key, q]) =>
    (q.history || []).forEach(h => log.push({ uid: u, key, ...h }))));
  log.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  return { ppl, pts, rows, practice, log: log.slice(0, 10) };
}
function scoreboard(topic) {
  const c = challenge(topic);
  if (!c.ppl.length) return "";
  const total = c.rows.length;
  const decided = c.rows.filter(r => r.lead.length).length;
  const left = total - decided;
  const next = S.me ? c.rows.find(r => !(prog(topic.id, S.me).quiz?.[r.key]?.attempts)) : null;
  const [a, b] = c.ppl.length >= 2 ? [c.ppl.find(u => u === S.me) || c.ppl[0], c.ppl.find(u => u !== (c.ppl.find(x => x === S.me) || c.ppl[0]))] : [c.ppl[0], null];
  const side = (u, align) => `<div class="sb-side ${align}">
      <span class="sb-av" style="background:${toneOf(u)}">${esc(initials(personName(u)))}</span>
      <span class="sb-name">${esc(personName(u))}</span>
      <span class="sb-pts num" style="color:${toneOf(u)}">${c.pts[u]}</span>
    </div>`;
  if (!b) return `<section class="scoreboard solo">
      <div class="sb-head"><span class="label">${ic("trophy")} Sfida di ${esc(monthLabel(topic.id).toLowerCase())}</span></div>
      <p class="sb-status">${ic("users")} La sfida parte quando entra anche l'altra persona.</p>
    </section>`;
  const pa = c.pts[a], pb = c.pts[b], sum = pa + pb;
  const status = pa === pb ? (sum ? "Parità" : "Tutto da giocare") : `${esc(personName(pa > pb ? a : b))} in vantaggio di ${Math.abs(pa - pb)}`;
  return `<section class="scoreboard" aria-label="Sfida del mese">
    <div class="sb-head">
      <span class="label">${ic("trophy")} Sfida di ${esc(monthLabel(topic.id).toLowerCase())}</span>
      <span class="sb-left">${ic("target")}<b class="num">${left}</b> ${left === 1 ? "test ancora in palio" : "test ancora in palio"}</span>
    </div>
    <div class="sb-main">
      ${side(a, "l")}
      <div class="sb-vs"><span class="sb-trophy">${ic("trophy")}</span><span class="sb-status-text">${status}</span></div>
      ${side(b, "r")}
    </div>
    <div class="sb-bar" role="img" aria-label="${esc(personName(a))} ${pa}, ${esc(personName(b))} ${pb}">
      <i style="flex:${sum ? pa : 1};background:${toneOf(a)}"></i><i style="flex:${sum ? pb : 1};background:${toneOf(b)}"></i>
    </div>
    <div class="sb-dots">${c.rows.map(r => `<span class="sb-dot ${r.lead.length ? "done" : ""}" title="${esc(r.label)}">${r.lead.length
      ? r.lead.map(u => `<i style="background:${toneOf(u)}"></i>`).join("")
      : "<i></i>"}<em>${r.key === "final" ? ic("flag") : roman(topic.chapters.findIndex(ch => ch.id === r.key) + 1)}</em></span>`).join("")}</div>
    ${next ? `<div class="row sb-cta"><button class="btn gold small" type="button" data-act="quiz" data-topic="${esc(topic.id)}" data-key="${esc(next.key)}">${ic(next.key === "final" ? "flag" : "target")}Prossimo: ${esc(next.label)}</button></div>` : ""}
  </section>`;
}
function challengeSection(topic) {
  const c = challenge(topic);
  if (!c.ppl.length) return "";
  const two = c.ppl.length >= 2;
  const fmt = iso => { try { return new Date(iso).toLocaleDateString("it-IT", { day: "numeric", month: "short" }); } catch (e) { return ""; } };
  const score = two ? `<div class="duel-score" aria-label="Punteggio della sfida">
      ${c.ppl.map((u, i) => `${i ? `<span class="vs">contro</span>` : ""}<span class="side">${avatar(u)}<span>${esc(personName(u))}</span><span class="pts">${c.pts[u]}</span></span>`).join("")}
    </div>

    : `<p class="kv">${ic("users")} La sfida parte quando avete fatto i test entrambi.</p>`;
  const rows = c.rows.map(r => `<tr><td>${esc(r.label)}</td>${r.scores.map((x, i) => `<td class="n ${r.lead.includes(c.ppl[i]) ? "lead" : ""}">${x == null ? "—" : x + "%"}${r.lead.includes(c.ppl[i]) ? ic("trophy", "lead-ic") : ""}</td>`).join("")}</tr>`).join("");
  const prac = `<tr class="muted"><td>${ic("zap")} Allenamenti</td>${c.practice.map(n => `<td class="n">${n || "—"}</td>`).join("")}</tr>`;
  const log = c.log.length ? `<ul class="log">${c.log.map(l => `<li>${avatar(l.uid, "sm")}<span>${esc(quizLabel(topic, l.key))}</span><span class="label num">${l.pct}% · ${esc(fmt(l.at))}</span></li>`).join("")}</ul>` : `<p class="kv">Ancora nessun test.</p>`;
  return `<section class="sec">
    ${secHead("trophy", "La sfida")}
    ${score}
    <div class="duel-wrap"><table class="duel">
      <thead><tr><th></th>${c.ppl.map(u => `<th>${avatar(u, "sm")}</th>`).join("")}</tr></thead>
      <tbody>${rows}${prac}</tbody>
    </table></div>
    <h3 class="label" style="margin-top:6px">${ic("clock")} Ultimi test</h3>
    ${log}
  </section>`;
}

  const tutor = S.tutor[ch.id];
  const prev = topic.chapters[idx - 1], next = topic.chapters[idx + 1];
  return `
  <div class="back"><button class="btn quiet" type="button" data-act="topic" data-topic="${esc(topic.id)}">${ic("left")}${esc(topic.title)}</button></div>
  <section class="chap-hero">
    <span class="label">${unitName(topic)} ${roman(idx + 1)}${isWeekly(topic) ? " · " + esc(weekRange(topic.id, idx, topic.chapters.length)) : ""}${ch.minutes ? ` · ${ic("clock")} ${Math.round(ch.minutes / 60)} ore` : ""}</span>
    <h1>${esc(ch.title)}</h1>
    <p class="intro">${esc(ch.summary)}</p>
  </section>
  <div class="grid">
    <div class="maincol">
      <section class="sec">
        ${secHead("bulb", "Concetti chiave")}
        <ul class="points">${(ch.points || []).map(p => `<li>${esc(p)}</li>`).join("")}</ul>
        ${ch.reading ? `<p class="reading">${ic("book")}<span>${esc(ch.reading)}</span></p>` : ""}
      </section>
      ${(ch.media || []).length ? `<section class="sec">
        ${secHead("headphones", "Ascolta e guarda")}
        ${mediaList(normMedia(ch.media, 6))}
      </section>` : ""}
      <section class="sec" id="lezioni">
        ${secHead("layers", "Lezioni")}
        <ol class="lesson-cards">${lessonCards}</ol>
        <div class="lesson-title"><span class="lnum big">${li + 1}</span><div><h3 class="lesson-h">${esc(plan[li].title)}</h3>${plan[li].focus ? `<p class="kv">${esc(plan[li].focus)}</p>` : ""}</div></div>
        ${lessonHTML}
      </section>
      ${canAsk() ? `<section class="sec">
        ${secHead("chat", "Chiedi al tutor")}
        <label class="sr" for="ask-${esc(ch.id)}">La tua domanda</label>
        <textarea id="ask-${esc(ch.id)}" data-draft="1" placeholder="Fai una domanda su questa settimana…"></textarea>
        <div class="row">${tutor?.busy
          ? `<span class="thinking">Il tutor sta rispondendo</span><button class="btn small" type="button" data-act="stop-tutor" data-ch="${esc(ch.id)}">Interrompi</button>`
          : `<button class="btn" type="button" data-act="ask" data-topic="${esc(topic.id)}" data-ch="${esc(ch.id)}">${ic("chat")}Chiedi</button>`}</div>
        ${tutor ? `<div class="panel"><span class="label">${esc(tutor.q)}</span><div class="prose" id="tutor-${esc(ch.id)}">${tutor.text ? md(tutor.text) : `<p class="thinking">Sto pensando</p>`}</div>${tutor.error ? `<p class="err">${esc(tutor.error)}</p>` : ""}</div>` : ""}
      </section>` : ""}
    </div>
    <aside class="sec">
      <div class="panel">
        ${panelHead("check", isWeekly(topic) ? "La tua settimana" : "Il tuo capitolo")}
        ${S.me ? `<button class="btn ${done ? "" : "primary"}" type="button" data-act="toggle-done" data-topic="${esc(topic.id)}" data-ch="${esc(ch.id)}" ${S.canWrite ? "" : "disabled"}>${ic("check")}${done ? doneWord(topic, true) : "Segna come " + doneWord(topic, true)}</button>` : `<p class="kv">Accedi per segnare i progressi.</p>`}
        <div class="scores">
          ${ppl.map(uid => { const q = prog(topic.id, uid).quiz?.[ch.id]; const d = prog(topic.id, uid).done?.[ch.id];
            return `<div class="score-line">${avatar(uid, "sm")}<span>${esc(personName(uid))}</span><span class="pills" style="margin-left:auto"><span class="pill ${d ? "ok" : ""}">${ic("check")}</span><span class="pill ${q ? "ok" : ""}">${ic("target")}<span class="num">${q ? q.best + "%" : "—"}</span></span></span></div>`; }).join("")}
        </div>
      </div>
      <div class="panel">
        ${panelHead("target", "Test della settimana")}
        ${(() => { const q = S.me ? prog(topic.id, S.me).quiz?.[ch.id] : null;
          return q?.attempts
            ? `<p class="kv">Fatto · <b class="num">${q.best}%</b></p><div class="row"><button class="btn" type="button" data-act="quiz" data-topic="${esc(topic.id)}" data-key="${esc(ch.id)}">${ic("target")}Rivedi il test</button></div>`
            : `<p class="kv">30 domande · uguali per entrambi · un solo tentativo</p><div class="row"><button class="btn gold" type="button" data-act="quiz" data-topic="${esc(topic.id)}" data-key="${esc(ch.id)}">${ic("target")}Inizia il test</button></div>`; })()}
      </div>
    </aside>
  </div>
  <nav class="pager" aria-label="Capitoli">
    ${prev ? `<button class="btn quiet" type="button" data-act="chapter" data-topic="${esc(topic.id)}" data-ch="${esc(prev.id)}">${ic("left")}${roman(idx)}. ${esc(prev.title)}</button>` : "<span></span>"}
    ${next ? `<button class="btn quiet" type="button" data-act="chapter" data-topic="${esc(topic.id)}" data-ch="${esc(next.id)}">${roman(idx + 2)}. ${esc(next.title)}${ic("right")}</button>` : ""}
  </nav>`;
}

function rivalLine(topic, key, pct) {
  const others = peopleFor(topic.id).filter(u => u !== S.me);
  if (!others.length) return "";
  return others.map(u => {
    const q = prog(topic.id, u).quiz?.[key];
    const name = esc(personName(u));
    if (key === "practice") return "";
    if (typeof q?.best !== "number") return `<span class="rival">${ic("trophy")}${name} non l'ha ancora fatto</span>`;
    const me = pct;
    return `<span class="rival">${ic("trophy")}${name}: <b class="num">${q.best}%</b> · ${me > q.best ? "il punto è tuo" : me === q.best ? "pareggio: un punto a testa" : "il punto va a " + name}</span>`;
  }).join("");
}

function quizView() {
  const z = S.quiz, topic = z && topicById(z.topicId);
  if (!topic) return topicView(currentTopic());
  const ch = z.key === "final" || z.key === "practice" ? null : topic.chapters.find(c => c.id === z.key);
  const chIdx = ch ? topic.chapters.indexOf(ch) : -1;
  const practiceOn = z.key === "practice" && z.data?.chapters?.length
    ? " · domande su " + (isWeekly(topic) ? "settimana " : "capitolo ") + z.data.chapters.map(id => roman(topic.chapters.findIndex(c => c.id === id) + 1)).join(", ") : "";
  const head = `
    <div class="back"><button class="btn quiet" type="button" data-act="${ch ? "chapter" : "topic"}" data-topic="${esc(topic.id)}" data-ch="${esc(ch?.id || "")}">${ic("left")}${esc(ch ? ch.title : topic.title)}</button></div>
    <section class="chap-hero">
      <span class="label">${ic(ch ? "target" : z.key === "practice" ? "zap" : "flag")} ${ch ? (isWeekly(topic) ? "Test · settimana " : "Test · capitolo ") + roman(chIdx + 1) : z.key === "practice" ? "Allenamento" + esc(practiceOn) : "Esame finale"}</span>
      <h1>${esc(ch ? ch.title : topic.title)}</h1>
    </section>`;
  if (z.loading) return head + `<div class="quiz"><p class="thinking">${canAsk() ? "Preparo le domande, può volerci un minuto" : "Carico le domande"}</p>
    ${z.ctl ? `<div class="row"><button class="btn small" type="button" data-act="stop-quiz">Interrompi</button></div>` : ""}</div>`;
  if (z.error || !z.data) return head + `<div class="quiz"><p class="err">${esc(z.error || "Test non disponibile.")}</p>
    <div class="row">${canAsk() ? `<button class="btn" type="button" data-act="quiz-new" data-topic="${esc(topic.id)}" data-key="${esc(z.key)}">Riprova</button>` : ""}</div></div>`;
  const qs = z.data.questions;
  const answered = Object.keys(z.answers).length;
  const result = z.submitted ? `<div class="result">
      <span class="big num">${z.score.pct}%</span>
      <span>${z.score.right}/${z.score.total} giuste · ${z.score.pct >= 85 ? "Ottimo!" : z.score.pct >= 60 ? "Buona base" : "Da ripassare"}</span>
      ${rivalLine(topic, z.key, z.score.pct)}
    </div>` : "";
  const oneShot = z.key !== "practice" && !z.submitted
    ? `<div class="notice">${ic("target")} Un solo tentativo: le risposte contano appena consegni.</div>` : "";
  const items = z.noReview ? `<p class="kv">Le risposte di questo test non sono state salvate.</p>` : qs.map((q, i) => {
    const pick = z.answers[i];
    return `<div class="q">
      <div class="qt"><span>${roman(i + 1)}</span><div>${esc(q.q)}</div></div>
      <div class="opts" role="group" aria-label="Opzioni della domanda ${i + 1}">
        ${q.options.map((o, j) => {
          let cls = "";
          if (z.submitted) { if (j === q.answer) cls = "right"; else if (j === pick) cls = "wrong"; }
          return `<button type="button" class="opt ${cls}" data-act="pick" data-q="${i}" data-o="${j}" aria-pressed="${pick === j}" ${z.submitted ? "disabled" : ""}><span class="k">${LETTERS[j]}</span><span>${esc(o)}</span></button>`;
        }).join("")}
      </div>
      ${z.submitted && q.explain ? `<p class="explain">${pick === q.answer ? ic("check", "ok-ic") : ic("x", "bad-ic") + "<b>" + LETTERS[q.answer] + "</b> · "}${esc(q.explain)}</p>` : ""}
    </div>`;
  }).join("");
  return head + `<div class="quiz">
    ${oneShot}
    ${result}
    ${items}
    <div class="row ${z.submitted ? "" : "quiz-actions"}">
      ${z.submitted
        ? `${z.key === "practice"
            ? `<button class="btn" type="button" data-act="quiz" data-topic="${esc(topic.id)}" data-key="practice">${ic("zap")}Ancora</button>
               ${canAsk() ? `<button class="btn" type="button" data-act="quiz-new" data-topic="${esc(topic.id)}" data-key="practice">${ic("sparkles")}Domande nuove</button>` : ""}`
            : ""}
           <button class="btn quiet" type="button" data-act="${ch ? "chapter" : "topic"}" data-topic="${esc(topic.id)}" data-ch="${esc(ch?.id || "")}">${ic("left")}Indietro</button>`
        : `<button class="btn primary" type="button" data-act="submit-quiz" ${answered < qs.length ? "aria-disabled=\"true\"" : ""}>${ic("check")}Consegna</button>
           <span class="qprog" aria-hidden="true"><i style="width:${Math.round(answered / qs.length * 100)}%"></i></span>
           <span class="label num">${answered}/${qs.length}</span>`}
    </div>
  </div>`;
}


function archiveView() {
  const list = [...S.topics].reverse();
  const header = `<section class="hero"><span class="label">${ic("archive")} Archivio</span><h1>Quello che avete studiato</h1></section>`;
  if (!list.length) return header + `<div class="empty">${ic("archive", "big-ic")}<h2>Archivio vuoto</h2></div>`;
  return header + `<div class="arch">${list.map(t => `
    <button class="card" type="button" data-act="topic" data-topic="${esc(t.id)}">
      <span class="row" style="gap:8px">${themeChip(t.theme)}<span class="label">${esc(monthLabel(t.id))}${t.id === NOW ? " · in corso" : ""}</span></span>
      <h3>${esc(t.title)}</h3>
      ${peopleFor(t.id).map(uid => { const s = stats(t, uid);
        return `<span class="score-line">${avatar(uid, "sm")}<span class="pills"><span class="pill">${ic("calendar")}<span class="num">${s.done}/${s.n}</span></span><span class="pill">${ic("flag")}<span class="num">${s.fin == null ? "—" : s.fin + "%"}</span></span></span></span>`; }).join("")}
    </button>`).join("")}</div>`;
}

function voteView() {
  const month = voteMonth(), vote = voteFor(month), topic = topicForVote(month, vote);
  const header = `<section class="hero">
    <span class="label">${ic("vote")} ${esc(monthLabel(month))}</span>
    <h1>${month === NOW ? "L'argomento di questo mese" : "Il prossimo argomento"}</h1>
    ${month === NOW ? `<p class="kv">${ic("calendar")} Votazione speciale: il vincitore sostituisce il programma attuale di ${esc(monthLabel(NOW).toLowerCase())}.</p>` : ""}
    ${vote?.status === "closed" ? "" : `<div class="facts"><span>${ic("layers")}<b class="num">5</b> candidati</span><span>${ic("check")}<b class="num">${VOTES_EACH}</b> voti a testa, uno per argomento</span><span>${ic("users")}risultati quando avete votato entrambi</span></div>`}
  </section>`;

  if (!vote) {
    const vs = S.voteSuggest;
    const rows = Array.from({ length: CANDIDATES }, (_, i) => `
      <div class="draft-row">
        <span class="rn">${roman(i + 1)}</span>
        <input type="text" id="cand-t-${i}" data-draft="1" placeholder="Argomento" aria-label="Argomento ${i + 1}" ${S.canWrite ? "" : "disabled"}>
        ${themeSelect("cand-th-" + i, "", `data-draft="1" aria-label="Tema dell'argomento ${i + 1}" ${S.canWrite ? "" : "disabled"}`)}
        <input type="text" id="cand-s-${i}" data-draft="1" placeholder="Una riga di descrizione (facoltativa)" aria-label="Descrizione dell'argomento ${i + 1}" ${S.canWrite ? "" : "disabled"}>
      </div>`).join("");
    return header + `<section class="sec">
      ${secHead("layers", "Cinque candidati")}
      <div class="draft">${rows}</div>
      ${vs?.error ? `<p class="err">${esc(vs.error)}</p>` : ""}
      <div class="row">
        ${canAsk() && S.canWrite ? (vs?.busy ? `<span class="thinking">Claude sta cercando idee</span>` : `<button class="btn" type="button" data-act="vote-suggest">${ic("sparkles")}Riempi con Claude</button>`) : ""}
        <button class="btn primary" type="button" data-act="vote-open" ${S.canWrite ? "" : "disabled"}>${ic("vote")}Apri la votazione</button>
      </div>
    </section>`;
  }

  const st = voteState(vote);
  const closed = vote.status === "closed";
  const picks = closed ? (ballotFor(S.me, vote.round) || []) : myPicks(vote);
  const saved = ballotFor(S.me, vote.round) || [];
  const dirty = !closed && (picks.length !== saved.length || picks.some(k => !saved.includes(k)));
  const cands = vote.candidates.map((c, i) => {
    const mine = picks.includes(c.key), n = st.counts[c.key].length, win = closed && vote.winner === c.key;
    return `<li class="cand ${win ? "win" : mine ? "mine" : ""}">
      <span class="rn">${roman(i + 1)}</span>
      <div><div class="row" style="gap:8px"><span class="t">${esc(c.title)}</span>${themeChip(c.theme)}</div>${c.subtitle ? `<div class="s">${esc(c.subtitle)}</div>` : ""}</div>
      ${closed ? (win ? `<span class="chip gold">${ic("trophy")}vincitore</span>` : "<span></span>")
        : `<button class="btn small vote-btn ${mine ? "primary" : ""}" type="button" data-act="vote-pick" data-key="${esc(c.key)}" aria-pressed="${mine}" ${S.me && S.canWrite ? "" : "disabled"}>${ic(mine ? "check" : "plus")}${mine ? "Votato" : "Vota"}</button>`}
      ${st.revealed ? `<div class="tally">
          <div class="bar" aria-label="${n} voti"><i style="width:${st.max ? Math.round(n / Math.max(st.max, 2) * 100) : 0}%"></i></div>
          <span class="ticks">${st.counts[c.key].map(uid => avatar(uid, "sm")).join("")}</span>
          <span class="label num">${n} ${n === 1 ? "voto" : "voti"}</span>
        </div>` : ""}
    </li>`;
  }).join("");

  const votersHTML = st.people.map(uid => {
    const b = ballotFor(uid, vote.round) || [];
    const done = b.length === VOTES_EACH;
    return `<div class="score-line">${avatar(uid, "sm")}<span>${esc(personName(uid))}</span>
      <span class="pill ${done ? "ok" : ""}" style="margin-left:auto">${ic(done ? "check" : "clock")}${done ? "votato" : "in attesa"}</span></div>`;
  }).join("");

  let outcome = "";
  if (closed) {
    const w = vote.candidates.find(c => c.key === vote.winner);
    outcome = `<div class="next-topic">
      <div class="nt-head">
        <span class="label">${ic("trophy")} Argomento di ${esc(monthLabel(month).toLowerCase())}${vote.tieBreak ? " · " + ic("dice") + " a sorte" : ""}</span>
        ${themeChip(w?.theme)}
      </div>
      <h2 class="nt-title">${esc(topic ? topic.title : w?.title || "")}</h2>
      ${(topic ? topic.subtitle : w?.subtitle) ? `<p class="sub">${esc(topic ? topic.subtitle : w.subtitle)}</p>` : ""}
      ${topic ? `<ol class="nt-weeks">${topic.chapters.map((c, i) => `<li><span class="lnum">${roman(i + 1)}</span><span>${esc(c.title)}</span></li>`).join("")}</ol>
        <div class="facts">
          <span>${ic("layers")}<b class="num">${topic.chapters.length * LESSONS_PER_WEEK}</b> lezioni</span>
          <span>${ic("book")}<b class="num">${(topic.books || []).length}</b> libri</span>
          <span>${ic("play")}<b class="num">${(topic.extras || []).length}</b> fonti</span>
        </div>` : ""}
      <div class="row">${topic
        ? `<button class="btn primary" type="button" data-act="topic" data-topic="${esc(month)}">${ic("book")}Apri il programma</button>`
        : canAsk() && S.canWrite ? (S.gen?.month === month && !S.gen.error
            ? `<span class="thinking">Claude scrive il programma</span><button class="btn small icon-only" type="button" data-act="stop-gen" aria-label="Interrompi">${ic("stop")}</button>`
            : `<button class="btn primary" type="button" data-act="gen-topic" data-month="${esc(month)}">${ic("sparkles")}Prepara il programma</button>`) : ""}</div>
      ${S.gen?.month === month && S.gen.error ? `<p class="err">${esc(S.gen.error)}</p>` : ""}
    </div>`;
  } else if (st.revealed && st.leaders.length) {
    const tie = st.leaders.length > 1;
    outcome = `<div class="result">
      <div style="display:grid;gap:4px;min-width:0">
        <span class="label">${tie ? "Pareggio" : "In testa"}</span>
        <span>${tie ? st.leaders.map(c => "<strong>" + esc(c.title) + "</strong>").join(" · ") + ` <span class="kv">(${st.max} voti)</span>` : `<strong>${esc(st.leaders[0].title)}</strong> <span class="kv">(${st.max} voti)</span>`}</span>
      </div>
      ${S.canWrite ? `<div class="row">${tie
        ? `<button class="btn gold" type="button" data-act="vote-close" data-random="1">${ic("dice")}Tira a sorte</button>`
        : `<button class="btn gold" type="button" data-act="vote-close">${ic("trophy")}Conferma</button>`}</div>` : ""}
    </div>`;
  }

  return header + `<div class="grid">
    <div class="maincol">
      <section class="sec">
        ${outcome}
        ${secHead("vote", closed ? "Risultati" : "Candidati", closed ? "" : `<span class="ballot-dots">${Array.from({ length: VOTES_EACH }, (_, i) => `<i class="${i < picks.length ? "on" : ""}"></i>`).join("")}</span>`)}
        <ol class="cands">${cands}</ol>
        ${closed ? "" : `<div class="row">
          <button class="btn primary" type="button" data-act="vote-submit" ${S.me && S.canWrite ? "" : "disabled"}>${ic("check")}${saved.length === VOTES_EACH ? "Aggiorna i voti" : "Conferma i voti"}</button>
          ${dirty && saved.length ? `<span class="label">non confermato</span>` : ""}
        </div>`}
      </section>
    </div>
    <aside class="sec">
      <div class="panel">
        ${panelHead("users", "Chi ha votato")}
        <div class="voters">${votersHTML}</div>
      </div>
      ${S.canWrite ? `<div class="panel">
        ${panelHead("refresh", "Nuova votazione")}
        ${S.busy.voteReset
          ? `<p class="kv">I voti dati finora si perdono.</p><div class="row"><button class="btn small primary" type="button" data-act="vote-reset">Sì, ricomincia</button><button class="btn small" type="button" data-act="vote-reset-cancel">Annulla</button></div>`
          : `<div class="row"><button class="btn small" type="button" data-act="vote-reset-ask">${ic("refresh")}Ricomincia</button></div>`}
      </div>` : ""}
    </aside>
  </div>`;
}

function votePanel() {
  const month = voteMonth(), vote = voteFor(month);
  let text, btn = "Vota";
  if (!vote) { text = "Proponete 5 argomenti"; btn = "Proponi"; }
  else if (vote.status === "closed") { const w = vote.candidates.find(c => c.key === vote.winner); text = `<strong>${esc(w?.title || "")}</strong>`; btn = "Risultato"; }
  else { const mine = (ballotFor(S.me, vote.round) || []).length === VOTES_EACH; text = mine ? "Hai votato · in attesa" : "Votazione aperta"; }
  return `<div class="panel">${panelHead("vote", esc(monthLabel(month)))}<p class="kv">${text}</p><div class="row"><button class="btn" type="button" data-act="go" data-view="vote">${ic("vote")}${btn}</button></div></div>`;
}

function viewHTML() { return nameBox() + viewBody(); }
function viewBody() {
  if (!S.loaded.topics) return `<div class="empty"><h2>Apro DoubleMind…</h2><p>Sto caricando gli argomenti e i vostri progressi.</p></div>`;
  const v = S.view;
  if (v.name === "vote") return voteView();
  if (v.name === "archive") return archiveView();
  if (v.name === "quiz") return quizView();
  if (v.name === "chapter") { const t = topicById(v.topicId); return t ? chapterView(t, v.chId) : topicView(currentTopic()); }
  if (v.name === "topic") return topicView(topicById(v.id) || currentTopic());
  return topicView(currentTopic());
}

function render() {
  const main = $("#main");
  const act = document.activeElement;
  const fid = act && main.contains(act) && act.id ? act.id : null;
  const sel = fid && typeof act.selectionStart === "number" ? [act.selectionStart, act.selectionEnd] : null;
  const keep = {};
  main.querySelectorAll("[data-draft]").forEach(el => { if (el.id) keep[el.id] = el.value; });
  if (fid && (act.tagName === "INPUT" && act.type === "text")) keep[fid] = act.value;
  main.innerHTML = viewHTML();
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) el.value = v; }
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  const tab = ["archive", "vote"].includes(S.view.name) ? S.view.name : "home";
  document.querySelectorAll("#nav button").forEach(b => { if (b.dataset.view === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const ppl = peopleFor(null);
  $("#people").innerHTML = ppl.map(uid => uid === S.me && S.canWrite
    ? `<button type="button" class="person-chip me" data-act="name-edit" title="Cambia il tuo nome">${avatar(uid, "sm")}<span>${esc(personName(uid))}</span>${ic("feather")}</button>`
    : `<span class="person-chip">${avatar(uid, "sm")}<span>${esc(personName(uid))}</span></span>`).join("");
  $("#mode").textContent = Store.mode === "cloud"
    ? (S.canWrite ? "Salvataggio condiviso attivo" : "Sola lettura")
    : "Salvataggio solo su questo dispositivo";
}

/* ---------- events ---------- */
function go(view) { S.view = view; window.scrollTo(0, 0); render(); }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return;
  const d = el.dataset, topic = d.topic ? topicById(d.topic) : null;
  switch (d.act) {
    case "go": go({ name: d.view }); break;
    case "topic": go({ name: "topic", id: d.topic }); break;
    case "chapter": go({ name: "chapter", topicId: d.topic, chId: d.ch }); break;
    case "toggle-done": saveProg(d.topic, cur => { cur.done[d.ch] = !cur.done[d.ch]; }); break;
    case "lesson": if (topic) writeLesson(topic, topic.chapters.find(c => c.id === d.ch), +d.i || 0); break;
    case "lesson-open": S.view = { ...S.view, lesson: +d.i || 0 }; render(); document.getElementById("lezioni")?.scrollIntoView({ block: "start" }); break;
    case "lesson-read": saveProg(d.topic, cur => { cur.read ||= {}; cur.read[d.key] = !cur.read[d.key]; }); break;
    case "stop-lesson": S.stream[d.id]?.ctl.abort(); break;
    case "ask": if (topic) askTutor(topic, topic.chapters.find(c => c.id === d.ch)); break;
    case "stop-tutor": S.tutor[d.ch]?.ctl.abort(); break;
    case "quiz": openQuiz(d.topic, d.key, false); break;
    case "quiz-new": openQuiz(d.topic, d.key, true); break;
    case "stop-quiz": S.quiz?.ctl?.abort(); break;
    case "pick": if (S.quiz && !S.quiz.submitted) { S.quiz.answers[+d.q] = +d.o; render(); } break;
    case "submit-quiz": submitQuiz(); break;
    case "quiz-retry": if (S.quiz && S.quiz.key === "practice") { S.quiz.answers = {}; S.quiz.submitted = false; window.scrollTo(0, 0); render(); } break;
    case "gen-topic": {
      const v = voteFor(d.month), w = v?.status === "closed" ? v.candidates.find(c => c.key === v.winner) : null;
      if (w) generateTopic(d.month, w.title, w.subtitle || "", w.theme || "", v.round);
      else toast("Prima scegliete l'argomento con la votazione.");
      break;
    }
    case "stop-gen": S.gen?.ctl?.abort(); break;
    case "name-edit": S.editName = true; render(); setTimeout(() => document.getElementById("my-name")?.focus(), 0); break;
    case "name-cancel": S.editName = false; render(); break;
    case "vote-suggest": suggestCandidates(voteMonth()); break;
    case "vote-open": openVote(voteMonth()); break;
    case "vote-pick": { const v = voteFor(voteMonth()); if (v) togglePick(v, d.key); break; }
    case "vote-submit": { const v = voteFor(voteMonth()); if (v) submitBallot(v); break; }
    case "vote-close": { const v = voteFor(voteMonth()); if (v) closeVote(v, d.random === "1"); break; }
    case "vote-reset-ask": S.busy.voteReset = true; render(); break;
    case "vote-reset-cancel": S.busy.voteReset = false; render(); break;
    case "vote-reset": {
      S.busy.voteReset = false;
      const m = voteMonth(), wasCurrent = !!S.votes.find(v => v.id === m)?.currentMonth;
      const doc = { month: m, candidates: [], status: "reset", resetAt: new Date().toISOString() };
      if (wasCurrent) doc.currentMonth = true;
      S.votes = [...S.votes.filter(v => v.id !== m), { ...doc, id: m }]; render();
      save("votes", m, doc, "Votazione azzerata");
      break;
    }
  }
});
document.addEventListener("submit", e => {
  if (e.target.matches('[data-form="name"]')) { e.preventDefault(); saveName(); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".chap")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset;
  if (d.act === "book") saveProg(d.topic, cur => { cur.books[d.i] = el.checked; });
});

/* ---------- boot ---------- */
async function boot() {
  render();
  const use = name => (window.claude && typeof window.claude.use === "function") ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
  const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")]);
  Store.init(db);
  S.user = user; S.sample = sample;
  if (Store.mode === "cloud") {
    S.me = user ? await user.id() : null;
    S.isOwner = user ? await user.isOwner() : false;
    const w = user ? await user.can("data.write") : null;
    S.canWrite = !!S.me && w !== false;
    if (!S.me) notice("Accedi a Claude per salvare i tuoi progressi. Per ora puoi solo consultare i programmi.");
  } else {
    S.me = "locale"; S.isOwner = true;
    notice("Stai usando DoubleMind fuori da Claude: i progressi restano solo in questo browser e la generazione con Claude non è disponibile.");
  }
  Store.watch("topics", rows => { S.topics = rows.filter(r => isMonth(r.id) && Array.isArray(r.chapters)).sort((a, b) => a.id.localeCompare(b.id)); S.loaded.topics = true; render(); });
  Store.watch("progress", rows => { S.progress = rows; S.loaded.progress = true; render(); refreshProfiles(); });
  Store.watch("votes", rows => { S.votes = rows; render(); });
  Store.watch("ballots", rows => { S.ballots = rows; render(); refreshProfiles(); });
  Store.watch("names", rows => { S.names = rows; S.loaded.names = true; render(); refreshProfiles(); });
  refreshProfiles();
}
boot();
</script>
